# Application Name
spring.application.name=LearnProjectBack

# PostgreSQL DataSource Configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/Learner
#spring.datasource.username=postgres
#spring.datasource.password=9155
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configuration
# 'create' will drop and re-create tables each time the application starts.
# Useful for development, but all data will be lost on restart.
spring.jpa.hibernate.ddl-auto=update

# (Optional) Show the SQL statements generated by Hibernate in the console
spring.jpa.show-sql=true

#jwt.secret=4f5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g
jwt.expirationMs=86400000

spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG


# File Upload
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
