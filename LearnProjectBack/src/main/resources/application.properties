# Application Name
spring.application.name=LearnProjectBack

# PostgreSQL DataSource Configuration
# Reads from environment variables, with fallback to default values for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Learner}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:9155}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

# (Optional) Show the SQL statements generated by Hibernate in the console
spring.jpa.show-sql=true

# JWT Configuration
# Reads from an environment variable, with a default for local development
jwt.secret=${JWT_SECRET:4f5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g}
jwt.expirationMs=86400000

spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG

# File Upload
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Twilio Configuration (Based on your initial error)
# Add these lines to manage your Twilio credentials securely
twilio.account_sid=${TWILIO_ACCOUNT_SID}
twilio.auth_token=${TWILIO_AUTH_TOKEN}