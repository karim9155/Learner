# Application Name
spring.application.name=LearnProjectBack

# PostgreSQL DataSource Configuration (reads from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration (reads from environment variables)
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

# Logging Level
logging.level.org.springframework.security=DEBUG

# File Upload (reads from environment variables)
file.upload-dir=${FILE_UPLOAD_DIR}

# Twilio Configuration (reads from environment variables)
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}