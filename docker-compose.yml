version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: learner-db
    environment:
      MYSQL_ROOT_PASSWORD: 9155 # CHANGE THIS
      MYSQL_DATABASE: Learner
      MYSQL_USER: postgres
      MYSQL_PASSWORD: 9155 # CHANGE THIS
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build: ./LearnProjectBack
    container_name: learner-backend
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/Learner
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=9155 # CHANGE THIS
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # Consider 'validate' for production
      - JWT_SECRET=4f5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g5j2h4g # CHANGE THIS
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    build: ./LearnProjectFront
    container_name: learner-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql_data:
  uploads: