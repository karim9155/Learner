  <!-- Login Card -->
  <div class="login-card-container">
    <div class="login-card">
      <!-- Header -->
      <div class="card-header">
        <div class="icon-container">
          <svg class="phone-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
          </svg>
        </div>
        <h2>Learner Access</h2>
        <p class="subtitle">Enter your phone number to begin.</p>
      </div>

      <!-- Form -->
      <div class="card-content">
        <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()" class="login-form" novalidate>
          <!-- Phone Number Field -->
          <div class="form-field">
            <label for="phone" class="field-label">Phone Number</label>
            <input
              id="phone"
              type="tel"
              formControlName="phone"
              placeholder="+21620000100"
              (input)="onPhoneInput($event)"
              [disabled]="isLoading"
              [class.error]="hasPhoneError()"
              class="phone-input"
              autocomplete="tel"
              required>

            <!-- Field Error -->
            <div *ngIf="hasPhoneError()" class="field-error">
              <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span>{{ getPhoneErrorMessage() }}</span>
            </div>
          </div>

          <!-- General Error Message -->
          <div *ngIf="errorMessage" class="general-error">
            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>{{ errorMessage }}</span>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="!isFormValid"
            class="submit-button"
            [class.loading]="isLoading">

            <!-- Loading Spinner -->
            <svg *ngIf="isLoading" class="loading-spinner" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 2v2m0 16v2m8-10h-2M4 12H2m15.364 6.364l-1.414-1.414M6.343 6.343L4.929 4.929m12.728 0l-1.414 1.414M6.343 17.657l-1.414 1.414"></path>
            </svg>

            <!-- Button Text -->
            <span *ngIf="isLoading">Processing...</span>
            <span *ngIf="!isLoading">Continue</span>
          </button>
        </form>

        <!-- Additional Info -->
        <div class="additional-info">
          <p>We'll verify your phone number and redirect you to your courses.</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-text">
      <p>Need help? Contact your administrator</p>
    </div>
  </div>
</div>
