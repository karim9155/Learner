  <!-- Login Card -->
  <div class="login-card-container">
    <div class="login-card">
      <!-- Header -->
      <div class="card-header">
        <div class="icon-container">
          <svg class="phone-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
          </svg>
        </div>
        <h2>Learner Access</h2>
        <p class="subtitle">Enter your phone number to begin.</p>
      </div>

      <!-- Form -->
      <div class="card-content">
        <!-- Phone Number Form -->
        <form *ngIf="!isCodeSent" [formGroup]="loginForm" (ngSubmit)="onSendCode()" class="login-form" novalidate>
          <div class="form-field">
            <label for="phone" class="field-label">Phone Number</label>
            <input
              id="phone"
              type="tel"
              formControlName="phone"
              placeholder="+21620000100"
              [disabled]="isLoading"
              class="phone-input"
              autocomplete="tel"
              required>
          </div>

          <div *ngIf="errorMessage" class="general-error">
            <span>{{ errorMessage }}</span>
          </div>

          <button type="submit" [disabled]="loginForm.invalid || isLoading" class="submit-button">
            <span *ngIf="!isLoading">Send Code</span>
            <span *ngIf="isLoading">Sending...</span>
          </button>
        </form>

        <!-- Verification Code Form -->
        <form *ngIf="isCodeSent" [formGroup]="verifyForm" (ngSubmit)="onVerifyCode()" class="login-form" novalidate>
          <div class="form-field">
            <label for="code" class="field-label">Verification Code</label>
            <input
              id="code"
              type="text"
              formControlName="code"
              placeholder="123456"
              [disabled]="isLoading"
              class="phone-input"
              autocomplete="one-time-code"
              required>
          </div>

          <div *ngIf="errorMessage" class="general-error">
            <span>{{ errorMessage }}</span>
          </div>

          <button type="submit" [disabled]="verifyForm.invalid || isLoading" class="submit-button">
            <span *ngIf="!isLoading">Verify Code</span>
            <span *ngIf="isLoading">Verifying...</span>
          </button>
        </form>

        <div class="additional-info">
          <p *ngIf="!isCodeSent">We'll send a verification code to your phone.</p>
          <p *ngIf="isCodeSent">Enter the 6-digit code we sent to your phone.</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-text">
      <p>Need help? Contact your administrator</p>
    </div>
  </div>
</div>
