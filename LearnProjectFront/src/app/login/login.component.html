<div class="login-container" [ngClass]="{'dark': darkMode}">
  <!-- Dark Mode Toggle -->
  <div class="dark-mode-toggle">
    <button
      type="button"
      class="toggle-btn"
      (click)="toggleDarkMode()"
      [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="darkMode" class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <svg *ngIf="!darkMode" class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <!-- Header -->
    <div class="card-header">
      <div class="logo-container">
        <img
          [src]="darkMode ? darkLogo : lightLogo"
          alt="Learn Logo"
          class="logo"
          onerror="this.style.display='none'">
      </div>
      <div class="header-text">
        <h1>Welcome back</h1>
        <p>Enter your credentials to access your account</p>
      </div>
    </div>

    <!-- Form -->
    <div class="card-content">
      <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            id="email"
            type="email"
            class="form-input"
            [class.error]="emailControl?.invalid && emailControl?.touched"
            placeholder="Enter your email"
            formControlName="email"
            [disabled]="isLoading"
            autocomplete="email">
          <div
            *ngIf="emailControl?.invalid && emailControl?.touched"
            class="error-message">
            {{ getEmailErrorMessage() }}
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-container">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-input password-input"
              [class.error]="passwordControl?.invalid && passwordControl?.touched"
              placeholder="Enter your password"
              formControlName="password"
              [disabled]="isLoading"
              autocomplete="current-password">
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="isLoading"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="showPassword" class="password-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </svg>
              <svg *ngIf="!showPassword" class="password-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
          <div
            *ngIf="passwordControl?.invalid && passwordControl?.touched"
            class="error-message">
            {{ getPasswordErrorMessage() }}
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="checkbox-label">
            <input
              type="checkbox"
              class="checkbox-input"
              [(ngModel)]="rememberMe"
              (change)="onRememberMeChange()"
              [ngModelOptions]="{standalone: true}">
            <span class="checkbox-text">Remember me</span>
          </label>
          <button
            type="button"
            class="forgot-password-btn"
            (click)="onForgotPassword()">
            Forgot password?
          </button>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="!isFormValid || isLoading"
          [class.loading]="isLoading">
          <div *ngIf="isLoading" class="loading-spinner">
            <div class="spinner"></div>
            <span>Signing in...</span>
          </div>
          <span *ngIf="!isLoading">Sign In</span>
        </button>
      </form>

      <!-- Sign Up Link -->
      <div class="signup-link">
        <p>
          Don't have an account?
          <button
            type="button"
            class="signup-btn"
            (click)="onSignUp()">
            Sign up
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
