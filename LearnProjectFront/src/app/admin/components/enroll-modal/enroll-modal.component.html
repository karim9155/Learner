<h1 mat-dialog-title>Enroll Employees in "{{ data.courseName }}"</h1>

<div mat-dialog-content>
  <mat-form-field appearance="fill" class="department-filter">
    <mat-label>Filter by Department</mat-label>
    <mat-select (selectionChange)="onDepartmentChange($event.value)">
      <mat-option [value]="''">All Departments</mat-option>
      <mat-option *ngFor="let department of departments" [value]="department">
        {{ department }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef style="width: 50px;">
        <mat-checkbox (change)="$event ? masterToggle() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef style="width: 150px;"> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} {{element.lastName}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef style="width: 250px;"> Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef style="width: 150px;"> Department </th>
      <td mat-cell *matCellDef="let element"> {{element.department}} </td>
    </ng-container>

    <ng-container matColumnDef="badgeNumber">
      <th mat-header-cell *matHeaderCellDef style="width: 120px;"> Badge Number </th>
      <td mat-cell *matCellDef="let element"> {{element.badgeNumber}} </td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef style="width: 150px;"> Phone </th>
      <td mat-cell *matCellDef="let element"> {{element.phone}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)"></tr>
  </table>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onEnroll()" [disabled]="isSubmitting">
    Enroll Selected
  </button>
</div>
