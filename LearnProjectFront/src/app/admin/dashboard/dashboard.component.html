<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center">
    <h2>Admin Dashboard</h2>
    <button class="btn btn-danger" (click)="logout()">Logout</button>
  </div>
  <hr>

  <div *ngFor="let course of courses" class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center" (click)="toggleVideos(course)">
      <span>
        <strong>{{ course.name }}</strong> - <em>Created by: {{ course.trainerEmail }}</em>
      </span>
      <button class="btn btn-sm btn-primary">{{ course.showVideos ? 'Hide' : 'Show' }} Videos</button>
    </div>
    <div class="card-body" *ngIf="course.showVideos">
      <p>{{ course.description }}</p>
      <h5>Videos:</h5>
      <ul class="list-group">
        <li *ngFor="let video of course.videos" class="list-group-item">
          <h5>{{ video.title }}</h5>
          <iframe width="100%" height="315" [src]="getEmbedUrl(video.youtubeUrl)" frameborder="0" allowfullscreen></iframe>
        </li>
      </ul>
    </div>
  </div>
</div>
