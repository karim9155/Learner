<div class="mobile-preview-container">
  <!-- Mobile Phone Frame -->
  <div class="mobile-frame">
    <div class="mobile-screen">
      <!-- Header -->
      <div class="screen-header">
        <button class="close-btn" (click)="closeDialog()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <span class="header-title">Course Preview</span>
      </div>

      <!-- Content -->
      <div class="screen-content">
        <div class="course-header">
          <h2 class="course-title">{{ data.title }}</h2>
          <p class="course-description">{{ data.description }}</p>
        </div>

        <div class="course-body">
          <div *ngIf="data.videos && data.videos.length > 0; else noVideos" class="video-list">
            <div *ngFor="let item of data.videos; let i = index" class="content-item">
              <!-- Video Section -->
              <div class="video-section">
                <h4 class="video-title">{{ i + 1 }}. {{ item.title }}</h4>
                <div class="video-wrapper">
                  <iframe [src]="getEmbedUrl(item.youtubeUrl)"
                          frameborder="0"
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                          allowfullscreen>
                  </iframe>
                </div>
              </div>

              <!-- Quiz Section -->
              <div class="quiz-section">
                <h5 class="quiz-title">Quiz</h5>
                <div *ngIf="item.quiz">
                  <p class="quiz-question">{{ item.quiz.question }}</p>
                  <div class="quiz-options">
                    <div *ngFor="let option of item.quiz.options; let optIndex = index"
                         class="option"
                         [class.correct]="optIndex === item.quiz.correctAnswer">
                      {{ option }}
                      <span *ngIf="optIndex === item.quiz.correctAnswer" class="correct-indicator">✓</span>
                    </div>
                  </div>
                </div>
                <div *ngIf="!item.quiz" class="no-quiz-info">
                  <p>No quiz for this video.</p>
                </div>
              </div>
            </div>
          </div>
          <ng-template #noVideos>
            <div class="empty-state-preview">
              <h4>No Videos Found</h4>
              <p>The course content does not contain any videos. Here is the raw data received by the preview component:</p>
              <pre>{{ data  }}</pre>
            </div>
          </ng-template>
        </div>
      </div>

      <!-- Footer -->
      <div class="screen-footer">
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
</div>
