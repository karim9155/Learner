<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center">
    <h2>Trainer Dashboard</h2>
    <button class="btn btn-danger" (click)="logout()">Logout</button>
  </div>
  <hr>

  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3>Create Course</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="courseForm" (ngSubmit)="createCourse()">
            <div class="form-group">
              <label for="courseName">Course Name</label>
              <input type="text" id="courseName" class="form-control" formControlName="name">
            </div>
            <div class="form-group">
              <label for="courseDescription">Course Description</label>
              <textarea id="courseDescription" class="form-control" formControlName="description"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="courseForm.invalid">Create Course</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3>Add Video</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="videoForm" (ngSubmit)="addVideo()">
            <div class="form-group">
              <label for="courseId">Course ID</label>
              <input type="number" id="courseId" class="form-control" formControlName="courseId">
            </div>
            <div class="form-group">
              <label for="videoTitle">Video Title</label>
              <input type="text" id="videoTitle" class="form-control" formControlName="title">
            </div>
            <div class="form-group">
              <label for="videoUrl">YouTube URL</label>
              <input type="text" id="videoUrl" class="form-control" formControlName="url">
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="videoForm.invalid">Add Video</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
