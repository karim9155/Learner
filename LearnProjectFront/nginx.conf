# This block redirects all non-secure HTTP traffic to HTTPS
server {
    # By adding 'default_server', this block becomes the default for all port 80 traffic
    listen 80 default_server;
    server_name snaplabs.online;
    return 301 https://$host$request_uri;
}

# This block handles all secure HTTPS traffic for your site
server {
    # By adding 'default_server', this block becomes the default for all port 443 traffic
    listen 443 ssl default_server;
    server_name snaplabs.online;

    # SSL settings from Certbot
    ssl_certificate /etc/letsencrypt/live/snaplabs.online-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snaplabs.online-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Forwards traffic to your frontend container
    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forwards API traffic to your backend container
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
