# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name snaplabs.online www.snaplabs.online;
    return 301 https://$host$request_uri;
}

# Serve the site over HTTPS
server {
    listen 443 ssl;
    server_name snaplabs.online www.snaplabs.online;

    # SSL Certificate settings
    ssl_certificate /etc/letsencrypt/live/snaplabs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snaplabs.online/privkey.pem;

    # Standard root and index
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
